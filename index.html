<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Upload API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .background {
      background-image: url('https://i.postimg.cc/Hk7nrx7f/HD-wallpaper-dark-vertical-anime-girls-artwork-anime-portrait-display.jpg');
      background-size: cover;
      background-position: center;
    }

    @keyframes colorChange {
      0% { color: blue; transform: scale(1.02); }
      50% { color: black; transform: scale(1.01); }
      100% { color: blue; transform: scale(1.02); }
    }

    .text-animation {
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-style: italic;
      animation: colorChange 2s infinite;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center px-4 background text-white">
  <div class="absolute inset-0 bg-black bg-opacity-40 z-0"></div>

  <div class="relative z-10 text-center mb-8">
    <h1 class="text-4xl mb-2 drop-shadow-lg text-animation uppercase">Welcome to ImgUpload</h1>
    <p class="text-lg max-w-xl mx-auto drop-shadow-md text-animation uppercase">
      Upload your images quickly and get a direct URL.
    </p>
  </div>

  <div class="relative z-10 bg-white bg-opacity-90 p-8 rounded-2xl shadow-xl w-full max-w-md text-gray-900">
    <h2 class="text-2xl font-bold mb-6 text-center">Upload an Image</h2>
    <form id="uploadForm" enctype="multipart/form-data" class="space-y-4">
      <input type="file" name="image" required class="block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700"/>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg">Upload</button>
    </form>
    <div id="result" class="mt-6 text-center"></div>
  </div>

  <footer class="relative z-10 mt-10 text-center text-sm text-white bg-black bg-opacity-50 px-4 py-2 rounded-t-lg">
    Made in Jubayer
  </footer>

  <audio id="bgmusic" autoplay loop>
    <source src="https://raw.githubusercontent.com/alamvai726/Hu/main/song.mp3" type="audio/mpeg">
  </audio>

  <script>
    // গান ইউজার ক্লিক করলেই বাজবে
    window.addEventListener('click', () => {
      document.getElementById('bgmusic').play();
    }, { once: true });

    // Upload API
    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Uploading...';

      try {
        const response = await fetch('https://api.imgbb.com/1/upload?key=6086994179d56e528b40bbcd1f512194', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          resultDiv.innerHTML = `
            <p class="text-green-600 font-semibold mb-2">Upload Successful!</p>
            <a href="${data.data.url}" target="_blank" class="text-blue-600 underline">${data.data.url}</a>
            <div class="mt-4">
              <img src="${data.data.url}" alt="Uploaded Image" class="rounded-lg max-w-full h-auto border border-gray-300 shadow-sm">
            </div>
            <div class="mt-6">
              <p>Scan the QR Code to view the image:</p>
              <img src="https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(data.data.url)}&size=200x200" alt="QR Code" class="w-32 h-32 mx-auto mt-4">
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<p class="text-red-600">Error: ${data.error.message}</p>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<p class="text-red-600">Upload failed: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
